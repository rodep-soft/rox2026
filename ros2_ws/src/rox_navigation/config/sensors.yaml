mecanum_odometry_node:
  ros__parameters:
    wheel_radius: 0.05
    robot_length: 0.47
    robot_width: 0.41
    publish_rate: 50.0
    feedback_timeout: 0.25
    wheel_feedback_topics: [/mecanum/fl/feedback, /mecanum/fr/feedback, /mecanum/rl/feedback, /mecanum/rr/feedback]

can_imu_node:
  ros__parameters:
    can_topic: /socketcan_bridge/rx
    frame_id: imu_link
    accel_can_id: 1280
    gyro_can_id: 1281
    quaternion_can_id: 1282
    accel_scale: 0.00980665
    gyro_scale: 0.0000174532925199433
    quaternion_scale: 0.00006103515625
    max_component_age: 0.1

tag_localization_node:
  ros__parameters:
    detection_topic: /detection
    output_topic: /tag/pose
    map_frame: map
    base_frame: base_link
    camera_frame: camera_link
    tag_position: [0.0, 0.0, 1.0]
    tag_rpy: [0.0, 0.0, 0.0]
    covariance_xy: 0.04
    covariance_yaw: 0.08
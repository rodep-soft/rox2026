# ==============================================================================
# BNO055 Heading Controller Parameters Configuration
# ==============================================================================

bno055_heading_control_node:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. Topic Configuration & Passthrough Pipeline
    # --------------------------------------------------------------------------
    imu_topic: "/imu/data"                         # Input IMU topic (sensor_msgs/msg/Imu)
    cmd_vel_in_topic: "/drive/cmd_vel"             # Raw input velocity command
    cmd_vel_out_topic: "/mecanum/cmd_vel_heading"  # Corrected output velocity command

    # --------------------------------------------------------------------------
    # 2. Control Gains (Base PID Architecture)
    # --------------------------------------------------------------------------
    kp: 5.0                            # Base Proportional Gain (低速時・静止時の安定ベース復元力)
    ki: 0.8                            # Integral Gain (定常偏差をゼロにし、元の目標角度へ完全に引き戻す)
    kd: 0.15                           # Base Derivative Gain (低速時・静止時のジャイロ制動力)
    kff: 0.0                           # Feedforward Gain
    max_i_term: 0.5                    # Anti-windup integral saturation limit (+-0.5)
    max_output: 3.5                    # Maximum angular velocity correction limit (rad/s)
    deadband_deg: 0.0                  # Deadband 0.0度（ズレ始めを一切待たずに1ミリ秒目から即時補正開始）
    cutoff_freq_hz: 50.0               # LPF遮断周波数を20Hz->50Hzに拡大（フィルタによる位相遅延を解消）
    max_slew_rate: 0.0                 # Max change rate of output (rad/s^2)
    angular_deadband: 0.15             # 手動旋回判定しきい値 (スティック中心の微小ドリフトによる補正解除を防止)
    turn_relock_delay: 0.08            # 旋回後の再ロック遅延を0.08sに極小化

    # --------------------------------------------------------------------------
    # 3. 最強適応ゲインスケジューリング (Velocity & Acceleration Adaptive Gain Scheduling)
    # --------------------------------------------------------------------------
    enable_adaptive_gains: true        # 車速・加速度に応じたゲイン自動適応の有効化
    max_translation_speed: 2.5         # [m/s] 基準最高速度
    kp_speed_scale: 1.0                # 車速適応倍率 (最高速時に Kp: 8.0 -> 16.0 へ動的ブースト)
    kd_accel_scale: 2.0                # 加速度適応倍率 (急加速の瞬間に Kd: 0.25 -> 0.75 へ瞬間ブースト)
    yaw_axis: "z"                      # Axis corresponding to physical Yaw rotation ("z", "x", or "y")

    # --------------------------------------------------------------------------
    # 4. Safety Watchdog & Fail-Safe Protection
    # --------------------------------------------------------------------------
    cmd_vel_timeout: 0.5               # Command loss timeout (s). Triggers Zero Velocity stop
    imu_timeout: 0.25                  # IMU loss timeout (s, 250ms). Prevents false-positive failsafe from CAN jitter
    enable_diagnostics: true           # Publish 1Hz real-time diagnostic status (/diagnostics)

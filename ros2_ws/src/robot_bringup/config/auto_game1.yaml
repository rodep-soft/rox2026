auto_game1_node:
  ros__parameters:
    # トピック・アクション名設定
    cmd_vel_topic: "/auto_game1/cmd_vel"
    joy_topic: "/joy"
    operation_mode_topic: "/operation_mode"
    dribble_enabled_topic: "/dribble/enabled"
    nav_action_name: "navigate_through_poses"
    kick_action_name: "kick"
    dribble_action_name: "dribble"
    pass_action_name: "pass"
    global_frame_id: "map"
    robot_base_frame_id: "base_link"

    # ボタンアサイン (joy_controller/README.md 参照)
    auto_stop_toggle_button: 8 # Create (自動停止切替 / Standby遷移)
    return_to_start_button: 9   # Options (スタート位置復帰)
    side_toggle_button: 3       # Triangle / △ (コートサイド切替: SIDE_A/SIDE_B)
    dribble_on_button: 2        # Circle / ○ (装填待ち時のドリブルON)
    start_autodrive_button: 1   # Cross / × (装填完了後の自律走行発進許可)

    # 制御周期および判定閾値
    control_period_sec: 0.05
    kick_start_reach_threshold: 0.2

    # PREPARE_KICK用制御パラメータ
    kick_target_velocity_x: 0.5
    kick_target_x: 1.5          # キック射出目標ラインのX座標 [m]
    kick_tolerance_x: 0.1       # キック射出のX座標許容誤差 [m] (±)
    kick_target_y: 0.0
    kick_target_yaw: 0.0
    kp_y: 1.0
    kd_y: 0.1
    kp_yaw: 1.0
    kd_yaw: 0.1

    # 通過点・目標点の座標設定 (単位: メートル)
    kick_start:
      x: 1.0
      y: 0.0
    kick_end:
      x: 2.0
      y: 0.5
    waypoint3:
      x: 3.0
      y: 0.0

    gate_far_side:
      x: 3.5
      y: 0.0

    pass_area:
      x: 2.0
      y: -1.5

    start_pose:
      x: 0.0
      y: 0.0

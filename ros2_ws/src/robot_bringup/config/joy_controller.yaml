/joy_controller:
  ros__parameters:
    # [ms] Joy入力断と判定してSTOPへ移るまでの時間 (200ms -> 1000msに緩和)
    joy_timeout_ms: 1000

    # タッチパッドをHomeとして扱う (非常停止切替)
    home_button: 13

    # L2とR2の同時押しでspring発射、L2+○で自動シュートを要求する
    left_trigger_axis: 3
    right_trigger_axis: 4
    circle_button: 2
    cross_button: 1         # ×でbelt RPMオフセットを1段下げる（下限-3段）
    triangle_button: 3      # △でbelt RPMオフセットを1段上げる（上限+3段）
    square_button: 0        # R2 + □でアームをHOME（ボトム側）へ切替
    spring_arm_open_delay_ms: 150     # [ms] 発射入力後、アームをOPENへ動かし始めるまでの待機時間
    spring_arm_restore_delay_ms: 800  # [ms] スプリング発射後、アームをDRIBBLEへ自動復帰させる最大待機時間

    # R1でdribble正回転をON/OFFする
    dribble_enable_button: 5
    # L1でスプリングゆっくり射出 (逆回転・正方向押し出し)
    slow_fire_button: 4
    # DPAD上/下でbelt levelを上げ下げする
    dpad_vertical_axis: 7

    # DPAD左でarmをOPENへ切替（HOME（ボトム側）はR2 + □）
    dpad_horizontal_axis: 6

    # 左スティックで前後左右並進、右スティック左右で旋回
    left_stick_x_axis: 0
    left_stick_y_axis: 1
    right_stick_x_axis: 2
    # PSボタンで前後左右の並進方向を反転
    ps_button: 12
    # Share/BackボタンでHeading Hold(IMU補正)のON/OFF切替
    heading_hold_toggle_button: 8

    # R2ボタン押下時の低速走行・減速機能 (ボタン番号: 7 (R2))
    # slow_turn_scale: 旋回速度倍率 (0.5で通常の1/2)
    # slow_linear_scale: 並進線速度倍率 (0.5で通常の1/2)
    slow_turn_button: 7
    slow_turn_scale: 0.3
    slow_linear_scale: 0.2

    # スティック中心ずれを無効化するデッドゾーン
    axis_deadzone: 0.05
    # トリガー・DPAD軸をONとみなすしきい値
    axis_on_threshold: 0.7

    # スティック全倒し時の最大速度
    # linear: [m/s]、angular: [rad/s]
    linear_x_limit: 3.7
    linear_y_limit: 3.7
    angular_z_limit: 2.0

    # スティック入力の加速の加速度制限
    # linear: [m/s^2]　angular: [rad/s^2]
    linear_x_acceleration_limit: 9.0
    linear_y_acceleration_limit: 4.5
    angular_z_acceleration_limit: 15.0

    # スティック入力の減速の加速度制限
    linear_x_deceleration_limit: 9.3
    linear_y_deceleration_limit: 7.5
    angular_z_deceleration_limit: 15.0

/joy_controller:
  ros__parameters:
    # ドリブルON時の回転数
    dribble_on_rpm: 800
    # 機構指令を保持する件数
    command_qos_depth: 1
    # [ms] Joy入力断と判定してSTOPへ移るまでの時間
    joy_timeout_ms: 200
    # [ms] 状態指令を再送する周期
    state_publish_period_ms: 20

    # タッチパッドをHomeとして扱う (非常停止切替)
    home_button: 13

    # L2とR2の同時押しでspring発射、L2+○で自動シュートを要求する
    left_trigger_axis: 3
    right_trigger_axis: 4
    circle_button: 2

    # R1でdribble回転をON/OFFする
    dribble_enable_button: 5
    # DPAD上/下でbelt levelを上げ下げする
    dpad_vertical_axis: 7

    # DPAD左右でarm位置を変更する(左側の十字キー)
    dpad_horizontal_axis: 6

    # 左スティックで前後左右並進、右スティック左右で旋回
    left_stick_x_axis: 0
    left_stick_y_axis: 1
    right_stick_x_axis: 2
    # PSボタンで前後左右の並進方向を反転
    ps_button: 12

    # スティック中心ずれを無効化するデッドゾーン
    axis_deadzone: 0.05
    # トリガー・DPAD軸をONとみなすしきい値
    axis_on_threshold: 0.7

    # スティック全倒し時の最大速度
    # linear: [m/s]、angular: [rad/s]
    linear_x_limit: 2.0
    linear_y_limit: 2.0
    angular_z_limit: 2.0

    # スティック入力の加速の加速度制限
    # linear: [m/s^2]　angular: [rad/s^2]
    linear_x_acceleration_limit: 2.0
    linear_y_acceleration_limit: 2.0
    angular_z_acceleration_limit: 4.0

    # スティック入力の減速の加速度制限
    linear_x_deceleration_limit: 3.0
    linear_y_deceleration_limit: 3.0
    angular_z_deceleration_limit: 6.0

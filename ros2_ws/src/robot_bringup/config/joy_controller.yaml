joy_controller:
  ros__parameters:
    # Joy入力を保持する件数
    joy_qos_depth: 3
    # 機構指令を保持する件数
    command_qos_depth: 1
    # [ms] Joy入力断と判定してSTOPへ移るまでの時間
    joy_timeout_ms: 200
    # [ms] 状態指令を再送する周期
    state_publish_period_ms: 20

    # タッチパッドをHomeとして扱う (非常停止切替)
    home_button: 13

    # L1+R1+△でspring発射を要求する
    spring_fire_enable_button: 4
    spring_fire_button: 3

    # L2+○で自動シュートサイクルを要求する
    left_trigger_axis: 3
    circle_button: 2

    # R1でdribble回転をON/OFFする
    dribble_enable_button: 5
    # DPAD上/下でbelt levelを上げ下げする
    dpad_vertical_axis: 7

    # R2を押していないときにDPAD上/下でbelt levelを変更する。
    # DPAD左でOPEN、DPAD右でFEED位置へ移動する。
    right_trigger_axis: 4
    dpad_horizontal_axis: 6

    # 左スティックで前後左右並進、右スティック左右で旋回
    left_stick_x_axis: 0
    left_stick_y_axis: 1
    right_stick_x_axis: 2
    # PSボタンで前後左右の並進方向を反転
    ps_button: 12

    # スティック中心ずれを無効化するデッドゾーン
    axis_deadzone: 0.05
    # トリガー・DPAD軸をONとみなすしきい値
    axis_on_threshold: 0.7

    # [m/s] 速度上限
    linear_x_limit: 2.0
    linear_y_limit: 2.0
    angular_z_limit: 2.0

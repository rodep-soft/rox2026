/dribble_controller_node:
  ros__parameters:
    
    # 10度 = 約 0.1745 rad
    # [rad] 各アーム目標位置
    dribble_position_rad: -0.93    # DRIBBLE姿勢
    open_position_rad: -1.35       # OPEN姿勢 (ボールを出すときの姿勢)
    home_position_rad: 0.2        # R2 + DPAD右で切替えるホーム姿勢
    bottom_position_rad: 0.0      # 物理的な真下姿勢 (ここを通過してから減速開始)
    feed_position_rad: 0.95        # FEED姿勢(発射機構に押し込む姿勢)
    slow_fire_dribble_position_rad: -1.32
    
    # [s] 自動シュートサイクルのタイミング
    belt_shot_delay_sec: 1.0         # ベルト停止時、自動起動からFEED開始までの待機時間[s]
    belt_clearance_timeout_sec: 2.0  # ばね退避を待つ最大時間，超過時はベルト発射を解除
    prepare_from_open_delay_sec: 0.1 # OPENからDRIBBLEへ戻った後の待機
    feed_duration_sec: 0.1           # FEED 押し込みを保持する時間
    
    # [rad/s] 区間ごとの最大角速度
    opening_max_rad_s: 4.0
    feeding_max_rad_s: 6.0
    returning_max_rad_s: 4.0
    dribbling_max_rad_s: 50.0

    # [rad/s^2] 区間ごとの最大角加速度
    opening_max_rad_s2: 10.0
    feeding_max_rad_s2: 5.0
    returning_max_rad_s2: 30.0
    dribbling_max_rad_s2: 10.0
    
    # [RPM] ドリブルローラー有効時の回転数
    dribble_on_rpm: 450             # DRIBBLE姿勢 (ボール保持中) の回転数
    slow_fire_dribble_rpm: 0        # スロー発射中の回転数（負値で逆回転）
    shot_cycle_opening_rpm: 1100     # ベルト発射準備時のローラ回転数
    shot_cycle_feeding_rpm: 500       # FEED中のローラ回転数
    shot_cycle_returning_rpm: 450   # FEED -> DRIBBLE時の回転数
    shot_cycle_belt_spinup_level: 1 # 自動起動時のベルト回転レベル (1～4)
    
    # [A] 電流値によるボール検知しきい値
    ball_detection_threshold_a: 4.2   # 1.7A 以上でボール保持(BALL DETECTED)と判定
    ball_lost_threshold_a: 2.8        # 1.1A 以下でボール喪失(BALL LOST)と判定
    current_lpf_alpha: 0.07           # 電流値の一次ローパスフィルタ係数 (最新値の重み)
    ball_detection_debounce_count: 12 # 連続12回(約240ms)の継続判定で発進・停止スパイクの誤検知を完全排除
    ball_lost_debounce_count: 12      # 連続12回(約240ms)の継続判定で停止時のバウンドによる誤解除を完全防止
    
    command_period_ms: 10 # コントロールタイマー周期
    # ── 高速移動時のボール保持安定化 (運動補正) ──
    cmd_vel_topic: "/mecanum/cmd_vel_heading" # IMU補正後の速度指令
    cmd_vel_timeout_sec: 0.2                  # 途絶時は補正を0に戻す
    cmd_vel_acc_lpf_alpha: 0.2                # 加速度のローバスフィルタ係数
    enable_motion_compensation: true          # 運動補正の有効化

    forward_velocity_reduction_rpm_per_mps: 50.0 # 1 m/sの前進速度あたりに減算するrpm
    backward_velocity_boost_rpm_per_mps: 100.0 # 1 rad/s の後退時に速度に応じて変化させるrpm
    backward_acc_rpm_per_mps2: 30.0            # 1 rad/s^2の加速度に応じて変化させるrpm
    turning_boost_rpm_per_rad_s: 30.0           # 旋回速度1 rad/sあたりに加算するrpm
    max_boost_rpm: 250                         # 加算する最大回転量
    max_reduction_rpm: 100                     # 前進時に減算する最大回転量

    position_logical_id: 5  # ROS2上の認識ID(ドリブルアーム)
    roller_logical_id: 12   # ROS2上の認識ID(ドリブルローラー)
    upper_belt_logical_id: 10
    under_belt_logical_id: 11
    position_target_topic: "/edulite/target"
    roller_target_topic: "/vesc/target"

/dribble_controller_node:
  ros__parameters:
    # 10度 = 約 0.1745 rad
    # [rad] 各アーム目標位置
    dribble_position_rad: 0.27    # DRIBBLE姿勢
    open_position_rad: -0.98      # OPEN姿勢
    bottom_position_rad: 0.0      # 物理的な真下姿勢 (ここを通過してから減速開始)
    feed_position_rad: 0.7        # FEED姿勢(発射機構に押し込む姿勢)
    
    # [s] 自動シュートサイクルのタイミング
    belt_spinup_delay_sec: 1.0  # ベルト回転開始から動作開始までのスピンアップ待機時間
    open_duration_sec: 0.1      # OPEN 姿勢を保持する時間
    feed_duration_sec: 0.5      # FEED 押し込みを保持する時間
    
    # [rad/s] 区間ごとの最大角速度
    opening_max_velocity_rad_s: 6.0   # DRIBBLE -> OPEN (最大速度6.0 rad/s)
    opening_accel_factor: 1.8         # OPEN 動作で最高速度に達するまでの遅さ倍率 (大きいほどTop speedまでゆったり加速)
    feeding_max_velocity_rad_s: 10.0  # OPEN -> FEED
    returning_max_velocity_rad_s: 2.0 # FEED -> DRIBBLE
    
    # [RPM] ドリブルローラー有効時の回転数
    dribble_on_rpm: 1320
    shot_cycle_opening_rpm: 1500    # DRIBBLE -> OPEN (真下に下がるまでの高回転数)
    shot_cycle_feeding_rpm: 0       # OPEN -> FEED (押し込み完了時に0 RPMへ滑らか減速)
    shot_cycle_returning_rpm: 1000  # FEED -> DRIBBLE
    
    # [A] 電流値によるボール検知しきい値
    ball_detection_threshold_a: 3.5 # 3.5A 以上でボール保持(BALL DETECTED)と判定
    
    # [ms] 指令再送周期
    command_period_ms: 10
    
    # ROS 2 QoS queue depth
    qos_depth: 1

    position_logical_id: 5  # ROS2上の認識ID(ドリブルアーム)
    roller_logical_id: 12   # ROS2上の認識ID(ドリブルローラー)
    position_target_topic: "/edulite/target"
    roller_target_topic: "/vesc/target"

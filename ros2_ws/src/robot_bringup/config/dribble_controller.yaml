dribble_controller_node:
  ros__parameters:
    # ドリブルON/OFF topic。std_msgs/msg/Bool。true=回す、false=止める。
    dribble_enabled_topic: /dribble/enabled
    # hardware_driver(stm32_driver_node)へ送る目標回転数command topic。std_msgs/msg/Int16、単位はRPM。
    dribble_rpm_topic: /dribble/target/rpm
    qos_depth: 1

    # ON時の目標回転数[RPM]。OFF時は0 RPM。
    on_rpm: 2000.0
    # RPM指令をpublishする周期[ms]。
    command_period_ms: 10

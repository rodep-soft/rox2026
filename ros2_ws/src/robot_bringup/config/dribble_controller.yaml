dribble_controller_node:
  ros__parameters:
    # [rad] 各アーム目標位置
    dribble_position_rad: 0.35
    open_position_rad: -1.0
    feed_position_rad: 1.3
    # [s] 自動シュートサイクルのタイミング
    open_duration_sec: 0.3      # OPEN 姿勢を保持する時間
    feed_duration_sec: 0.6      # FEED 押し込みを保持する時間
    # [rad/s] 区間ごとの最大角速度
    opening_max_velocity_rad_s: 2.0   # DRIBBLE -> OPEN
    feeding_max_velocity_rad_s: 3.0   # OPEN -> FEED
    returning_max_velocity_rad_s: 2.0 # FEED -> DRIBBLE
    # [RPM] ドリブルローラー有効時の回転数
    dribble_on_rpm: 800
    # [ms] 指令再送周期
    command_period_ms: 10
    # ROS 2 QoS queue depth
    qos_depth: 1

    position_logical_id: 5
    roller_logical_id: 12
    position_target_topic: "/edulite/target"
    roller_target_topic: "/vesc/target"

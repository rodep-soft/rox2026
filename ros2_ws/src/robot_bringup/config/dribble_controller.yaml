/dribble_controller_node:
  ros__parameters:
    
    # 10度 = 約 0.1745 rad
    # [rad] 各アーム目標位置
    dribble_position_rad: -0.95   # DRIBBLE姿勢
    open_position_rad: -1.45       # OPEN姿勢 (ボールを出すときの姿勢)
    bottom_position_rad: 0.0      # 物理的な真下姿勢 (ここを通過してから減速開始)
    feed_position_rad: 0.7        # FEED姿勢(発射機構に押し込む姿勢)
    slow_fire_dribble_position_rad: -1.2
    
    # [s] 自動シュートサイクルのタイミング
    belt_spinup_timeout_sec: 2.0       # 実測RPM未到達時の最大待機
    belt_spinup_min_delay_sec: 0.1      # 実測RPM到達後も確保する最短待機
    belt_ready_ratio: 0.9                # 目標RPMに対する実測RPMの完了比率
    prepare_from_open_delay_sec: 0.1     # OPENからDRIBBLEへ戻った後の待機
    feed_duration_sec: 0.2      # FEED 押し込みを保持する時間
    
    # [rad/s] 区間ごとの最大角速度
    opening_max_acceleration_rad_s2: 15.0
    feeding_max_acceleration_rad_s2: 15.0
    returning_max_acceleration_rad_s2: 18.0
    dribbling_max_velocity_rad_s: 3.0
    dribbling_max_acceleration_rad_s2: 12.0
    
    # [RPM] ドリブルローラー有効時の回転数
    dribble_on_rpm: 270             # DRIBBLE姿勢 (ボール保持中) の回転数
    slow_fire_dribble_rpm: -200     # スロー発射中の回転数（負値で逆回転）
    shot_cycle_opening_rpm: 1000    # ベルト発射準備時のローラ回転数
    shot_cycle_feeding_rpm: 1000       # OPEN -> FEED (押し込み完了時に0 RPMへ滑らか減速)
    shot_cycle_returning_rpm: 270  # FEED -> DRIBBLE
    
    # [A] 電流値によるボール検知しきい値
    ball_detection_threshold_a: 4.2 # 1.7A 以上でボール保持(BALL DETECTED)と判定
    ball_lost_threshold_a: 2.8      # 1.1A 以下でボール喪失(BALL LOST)と判定
    current_lpf_alpha: 0.07          # 電流値の一次ローパスフィルタ係数 (最新値の重み)
    ball_detection_debounce_count: 12  # 連続12回(約240ms)の継続判定で発進・停止スパイクの誤検知を完全排除
    ball_lost_debounce_count: 12       # 連続12回(約240ms)の継続判定で停止時のバウンドによる誤解除を完全防止
    
    command_period_ms: 10
    
    # ROS 2 QoS queue depth
    qos_depth: 1

    # ── 高速移動時のボール保持安定化 (運動補正) ──
    cmd_vel_topic: "/mecanum/cmd_vel_heading"  # IMU補正後の速度指令
    cmd_vel_timeout_sec: 0.2              # 途絶時は補正を0に戻す
    cmd_vel_acceleration_lpf_alpha: 0.2
    enable_motion_compensation: true          # 運動補正の有効化

    backward_velocity_boost_rpm_per_mps: 60.0
    backward_acceleration_rpm_per_mps2: 20.0
    max_boost_rpm: 400


    position_logical_id: 5  # ROS2上の認識ID(ドリブルアーム)
    roller_logical_id: 12   # ROS2上の認識ID(ドリブルローラー)
    position_target_topic: "/edulite/target"
    roller_target_topic: "/vesc/target"

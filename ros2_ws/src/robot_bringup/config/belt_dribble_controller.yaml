belt_dribble_controller_node:
  ros__parameters:
    # [RPM] beltの各操作levelで送る目標回転数。
    # 最初に1000くらいをかませないとbeltが回らない時がある
    # MAX rpmの値は4500くらい
    level_1_rpm: 1000
    level_2_rpm: 1900
    level_3_rpm: 2600
    level_4_rpm: 3700
    level_5_rpm: 4000
    level_6_rpm: 4500
    # [RPM] beltが目標RPMに到達したと判定する誤差。
    belt_rpm_tolerance: 100

    # [RPM] dribble有効時に送る目標回転数。
    dribble_on_rpm: 2000
    # [RPM] dribbleが目標RPMに到達したと判定する誤差。
    dribble_rpm_tolerance: 100

    # [s] 3モータが到達状態を維持してshot cycle可能とするまでの時間。
    ready_hold_sec: 0.1
    # [s] 現在RPM feedbackがこの時間を超えて更新されない場合、shotを拒否する。
    feedback_timeout_sec: 0.5

    # [ms] 3モータの目標RPM送信周期。
    command_period_ms: 20
    # ROS 2 QoSのqueue depth。
    qos_depth: 1

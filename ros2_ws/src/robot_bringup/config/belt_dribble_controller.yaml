belt_dribble_controller_node:
  ros__parameters:
    operation_mode_topic: /operation_mode  # std_msgs/msg/UInt8。0=STOP、1=DRIVE、2=SHOT_CYCLE、3=BELT_ONLY。
    belt_mode_topic: /belt/mode  # std_msgs/msg/UInt8。0=STOP、1〜6=LEVEL_1〜LEVEL_6。
    dribble_enabled_topic: /dribble/enabled  # std_msgs/msg/Bool。
    shot_cycle_request_topic: /shot_cycle/request  # std_msgs/msg/Bool。true受信時にshoot_readyなら実行する。
    emergency_stop_topic: /emergency_stop  # std_msgs/msg/Bool。
    underbelt_target_rpm_topic: /underbelt/target/rpm  # std_msgs/msg/Int16 [RPM]。
    upperbelt_target_rpm_topic: /upperbelt/target/rpm  # std_msgs/msg/Int16 [RPM]。
    dribble_target_rpm_topic: /dribble/target/rpm  # std_msgs/msg/Int16 [RPM]。
    underbelt_current_rpm_topic: /underbelt/current/rpm  # std_msgs/msg/Int16 [RPM]。
    upperbelt_current_rpm_topic: /upperbelt/current/rpm  # std_msgs/msg/Int16 [RPM]。
    dribble_current_rpm_topic: /dribble/current/rpm  # std_msgs/msg/Int16 [RPM]。
    shot_cycle_start_topic: /shot_cycle/start  # std_msgs/msg/Bool。trueでshot cycleを開始する。
    shoot_ready_topic: /shoot_ready  # std_msgs/msg/Bool。3モータのRPM到達状態。

    stop_rpm: 0  # [RPM] STOP時の目標。0固定。
    level_1_rpm: 3000  # [RPM] belt LEVEL_1。
    level_2_rpm: 3500  # [RPM] belt LEVEL_2。
    level_3_rpm: 4000  # [RPM] belt LEVEL_3。
    level_4_rpm: 4500  # [RPM] belt LEVEL_4。
    level_5_rpm: 5000  # [RPM] belt LEVEL_5。
    level_6_rpm: 5500  # [RPM] belt LEVEL_6。
    dribble_on_rpm: 2000  # [RPM] dribble ON時の目標。
    belt_rpm_tolerance: 100  # [RPM] under・upperbeltの到達許容誤差。
    dribble_rpm_tolerance: 100  # [RPM] dribbleの到達許容誤差。
    ready_hold_sec: 0.1  # [s] 3モータの到達を連続維持する時間。
    command_period_ms: 10  # [ms] 3モータの目標RPM送信周期。
    qos_depth: 1  # ROS 2 QoSのqueue depth。

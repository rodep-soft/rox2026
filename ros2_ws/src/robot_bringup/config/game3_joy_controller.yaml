/joy_controller:
  ros__parameters:
    joy_timeout_ms: 1000

    home_button: 13

    # Game3はL2 + R2でShot Cycleを1回要求する。
    # Spring fire要求は送らない。
    left_trigger_axis: 3
    right_trigger_axis: 4
    trigger_chord_requests_shot_cycle: true
    circle_button: 2
    square_button: 0
    spring_arm_open_delay_ms: 150
    spring_arm_restore_delay_ms: 800

    dribble_enable_button: 5
    # Game3ではSpring slow fire要求を無効化する。
    slow_fire_button: -1
    dpad_vertical_axis: 7
    dpad_horizontal_axis: 6

    left_stick_x_axis: 0
    left_stick_y_axis: 1
    right_stick_x_axis: 2
    ps_button: 12
    heading_hold_toggle_button: 8

    # R2の走行・旋回減速はGame3でも維持する。
    slow_turn_button: 7
    slow_turn_scale: 0.3
    slow_linear_scale: 0.2

    axis_deadzone: 0.05
    axis_on_threshold: 0.7

    linear_x_limit: 3.7
    linear_y_limit: 3.7
    angular_z_limit: 2.0

    linear_x_acceleration_limit: 6.5
    linear_y_acceleration_limit: 4.2
    angular_z_acceleration_limit: 15.0
    linear_x_deceleration_limit: 7.3
    linear_y_deceleration_limit: 6.5
    angular_z_deceleration_limit: 15.0

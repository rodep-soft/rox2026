# ==============================================================================
# 🎯 PK Auto-Aim Controller Configuration (PK 1点狙い照準モード)
# ==============================================================================
/pk_aim_node:
  ros__parameters:
    # ── 🏷️ AprilTag & ターゲット設定 ──
    tag_prefix: "tag16h5:"
    target_distance: 4.0   # [m] 的までの想定距離 (PK標準射出距離)

    # 的のTag ID配置 (上段: LEVEL_3, 中段: LEVEL_2, 下段: LEVEL_1)
    # [上段 (Row 2)]: Idx 0: 14 (左), Idx 1: 15 (中), Idx 2: 16 (右)
    # [中段 (Row 1)]: Idx 3: 17 (左), Idx 4: 18 (中), Idx 5: 19 (右)
    # [下段 (Row 0)]: Idx 6: 20 (左), Idx 7: 21 (中), Idx 8: 22 (右)
    top_tags: [14, 15, 16]
    middle_tags: [17, 18, 19]
    bottom_tags: [20, 21, 22]

    # ── 📷 カメラパラメータ (ピンホールカメラモデル) ──
    camera_offset_x: 0.265  # [m] ロボット中心からカメラの前後オフセット
    camera_offset_y: 0.035  # [m] ロボット中心からカメラの左右オフセット
    camera_offset_z: 0.193  # [m] ロボット中心からカメラの高さ
    camera_image_width: 1920.0
    camera_image_height: 1080.0
    camera_fx: 800.0        # [px] 水平焦点距離
    camera_fy: 800.0        # [px] 垂直焦点距離
    camera_cx: 960.0        # [px] 光学主点X
    camera_cy: 540.0        # [px] 光学主点Y

    # ── 🎯 旋回制御パラメータ (PD + Slew Rate + Damping) ──
    kp_yaw: 1.1             # 比例ゲイン (適度な応答性を維持)
    yaw_command_sign: -1.0  # 機体のangular.z符号に合わせる
    kd_yaw: 0.35            # 微分/制動ゲイン (IMU gyro_zダンピング強化で通り過ぎを阻止)
    min_angular_z: 0.015    # [rad/s] 静止摩擦補償最小角速度 (低速クリープ)
    max_angular_z: 0.25     # [rad/s] 最大旋回角速度 (約14 deg/s: カメラブレ防止)
    max_angular_accel: 1.5  # [rad/s^2] 旋回加減速度リミッター (急制動時のスリップ防止)
    yaw_tolerance: 0.008    # [rad] 角度誤差許容値 (約0.46度: 4m先で横ズレ±3.2cmの超高精度)
    dist_tolerance: 0.05    # [m] 距離誤差許容値
    aim_yaw_offset_deg: 2.0 # [deg] 射出方向の左右照準オフセット (+2.0度左向き補正で右寄りを相殺)

    # ── 🧪 テストモード切替 ──
    test_alignment_only: false     # true: ベルトを動かさず旋回のみテスト
    test_panel_state_display: false # true: 0.5秒ごとにターミナルへ9マス色付き起立/選択モニターを出力 (false: 決定時のみ出力)

    # ── 🛡️ タイムアウト設定 ──
    tag_lost_timeout: 3.0       # [s] タグが遮られたときの姿勢保持時間
    visual_valid_timeout: 0.5   # [s] 照準完了判定に必要な直近視覚有効時間
    align_lost_timeout: 3.0     # [s] ALIGNING・PREPARING_SHOOT中の完全ロスト判定時間
    shot_fallback_timeout: 5.0  # [s] 射出ボタン押下後の保険タイムアウト

game1_auto_node:
  ros__parameters:
    kp_linear: 1.2
    kp_angular: 2.0
    max_linear_vel: 1.5
    max_angular_vel: 1.5
    pos_tolerance: 0.08
    yaw_tolerance: 0.05

    # ── テストモード設定 (単一WP移動テスト) ──
    test_mode: false
    wp_test_x: -4.50
    wp_test_y: 2.50
    wp_test_yaw: 0.0

    # ── Game 1 実機ウェイポイント設定 [x (m), y (m), yaw (rad)] ──
    # 1. ゲート外側シュート位置 (ゲート X=-4.5, Y=1.5 の左手前)
    wp_gate_x: -5.925
    wp_gate_y: 1.500
    wp_gate_yaw: 0.0

    # 2. ゲート横回り込み通過点 (ゲート下側・手前側を迂回)
    wp_around_gate_x: -4.500
    wp_around_gate_y: 0.500
    wp_around_gate_yaw: 0.0

    # 3. ボールキャッチ予想位置 (ゲート出口で減速停止したボールを回収)
    wp_ball_x: -3.500
    wp_ball_y: 1.500
    wp_ball_yaw: 0.0

    # 4. パスエリア進入・投下位置
    wp_pass_area_x: -1.300
    wp_pass_area_y: 1.500
    wp_pass_area_yaw: 0.0

    # 5. 上側ゲート安全回避 帰還中間経由点 (上側ゲート X=-3.2, Y=3.8 を右側に大きくクリア)
    wp_return_safe_x: -2.000
    wp_return_safe_y: 3.200
    wp_return_safe_yaw: 2.000

    # 6. スタート復帰位置 (左上コーナー)
    wp_start_x: -5.925
    wp_start_y: 4.950
    wp_start_yaw: -1.5708

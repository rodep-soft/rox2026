/**:
  ros__parameters:
    kp_linear: 1.0
    kp_angular: 2.0
    max_linear_vel: 3.5
    max_angular_vel: 3.5
    pos_tolerance: 0.08
    yaw_tolerance: 0.05

    # ── テストモード設定 (単一WP移動テスト) ──
    test_mode: false
    wp_test_x: -4.50
    wp_test_y: 2.50
    wp_test_yaw: 0.0

    # ── Game 1 共通ウェイポイント設定 [x (m), y (m), yaw (rad)] ──
    # 全区間で yaw=0.0 (ゲート射出方向: X軸正方向) を完全固定。旋回ゼロで全方向ホロノミック移動
    # 1. ゲート外側シュート位置 (縦向きゲート: X=-4.600, Y=2.165 の自陣側 X=-5.925 で射出)
    wp_gate_x: -5.925
    wp_gate_y: 2.165
    wp_gate_yaw: 0.0

    # 2. ゲート横回り込み通過点
    wp_around_gate_x: -4.600
    wp_around_gate_y: 1.600
    wp_around_gate_yaw: 0.0

    # 3. ボールキャッチ予想位置 (フライスルーで止まらずそのままパスエリアへ)
    wp_ball_x: -2.700
    wp_ball_y: 2.165
    wp_ball_yaw: 0.0

    # 4. パスエリア外側停止・投下位置 (境界X=-1.700mに先端を押し当て)
    wp_pass_area_x: -2.030
    wp_pass_area_y: 1.641
    wp_pass_area_yaw: 0.0

    # 5. 上側ゲート最短クリア 頂点ウェイポイント
    wp_return_apex_x: -3.800
    wp_return_apex_y: 3.200
    wp_return_apex_yaw: 0.0

    # 6. スタート復帰位置 - ゲート正面(yaw=0.0)を向けたまま帰還し、次サイクルも旋回ゼロで即発進
    wp_start_x: -5.925
    wp_start_y: 4.950
    wp_start_yaw: 0.0

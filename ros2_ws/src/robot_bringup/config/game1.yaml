/**:
  ros__parameters:
    kp_linear: 1.0
    kp_angular: 2.0
    max_linear_vel: 3.5
    max_angular_vel: 3.5
    pos_tolerance: 0.08
    yaw_tolerance: 0.05

    # ── テストモード設定 (単一WP移動テスト) ──
    test_mode: false
    wp_test_x: -4.50
    wp_test_y: 2.50
    wp_test_yaw: 0.0

    # ── Game 1 共通ウェイポイント設定 [x (m), y (m), yaw (rad)] ──
    # 1. ゲート外側シュート位置 (縦向きゲート: X=-4.600, Y=2.165 の自陣側 X=-5.925 で射出)
    wp_gate_x: -5.925
    wp_gate_y: 2.165
    wp_gate_yaw: 0.0

    # 2. ゲート横回り込み通過点 (ゲート下側Y=1.915より外を通過)
    wp_around_gate_x: -4.600
    wp_around_gate_y: 1.400
    wp_around_gate_yaw: 0.0

    # 3. ボールキャッチ予想位置 (ゲートを転がり抜けて止まる)
    wp_ball_x: -2.700
    wp_ball_y: 2.165
    wp_ball_yaw: 0.0

    # 4. パスエリア外側射出・投下位置 (パスエリア中心 X=-1.316, Y=1.641 の外側 X=-2.05で停止)
    wp_pass_area_x: -2.050
    wp_pass_area_y: 1.641
    wp_pass_area_yaw: 0.0

    # 5. 上側ゲート最短クリア 頂点ウェイポイント (上側ゲートX=-3.415,Y=4.025の内側を通過)
    wp_return_apex_x: -3.800
    wp_return_apex_y: 3.200
    wp_return_apex_yaw: 2.200

    # 6. スタート復帰位置 (左上コーナー) - 前向き(ゲート方向)で帰還してそのまま次サイクル発進
    wp_start_x: -5.925
    wp_start_y: 4.950
    wp_start_yaw: -1.5708

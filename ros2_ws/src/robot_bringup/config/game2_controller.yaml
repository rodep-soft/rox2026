game2_auto_node:
  ros__parameters:
    base_frame: "base_link"
    target_distance: 4.0
    # ── 📐 カメラ物理位置 (base_link 車体中心から見たカメラ位置) ──
    camera_offset_x: 0.265  # [m] 前方オフセット (実測値: 265mm)
    camera_offset_y: 0.035  # [m] 左カメラオフセット (実測値: 35mm)
    camera_offset_z: 0.193  # [m] 上方オフセット (実測値: 193mm)
    camera_fov_h: 1.83      # [rad] 水平画角 (約105度)

    kp_yaw: 1.5
    kd_yaw: 0.12
    max_angular_z: 0.8
    yaw_tolerance: 0.015    # [rad] 角度誤差許容値 (約0.85度)
    dist_tolerance: 0.03

    # ── 🧪 テストモード切替 ──
    # true: ドリブル・ベルト・ばねを動かさず、車体の角度合わせ（旋回）だけをテスト
    # false: ボール保持検知・ベルト昇降・ばね射出を含む本番フル自動射出
    test_alignment_only: true

    # ── 射出パラメータ ──
    rpm_bottom: 3000.0
    rpm_middle: 4500.0
    rpm_top: 6000.0
    shoot_hold_duration: 0.8
    ball_settle_duration: 0.3

    # ── シュートパネル AprilTag ID ──
    bottom_tags: [20, 21, 22]
    middle_tags: [17, 18, 19]
    top_tags: [14, 15, 16]

game2_auto_node:
  ros__parameters:
    base_frame: "base_link"
    target_distance: 4.0
    kp_yaw: 0.5
    kd_yaw: 0.05
    max_angular_z: 0.35
    yaw_tolerance: 0.04
    dist_tolerance: 0.03

    # ── 🧪 テストモード切替 ──
    # true: ドリブル・ベルト・ばねを動かさず、車体の角度合わせ（旋回）だけをテスト
    # false: ボール保持検知・ベルト昇降・ばね射出を含む本番フル自動射出
    test_alignment_only: true

    # ── 射出パラメータ ──
    rpm_bottom: 3000.0
    rpm_middle: 4500.0
    rpm_top: 6000.0
    shoot_hold_duration: 0.8
    ball_settle_duration: 0.3

    # ── シュートパネル AprilTag ID ──
    bottom_tags: [20, 21, 22]
    middle_tags: [17, 18, 19]
    top_tags: [14, 15, 16]

arm_position_controller_node:
  ros__parameters:
    # [rad] 各アーム目標位置
    dribble_position_rad: 0.35
    open_position_rad: -1.0
    feed_position_rad: 1.3
    # [s] 自動シュートサイクルのタイミング
    open_duration_sec: 0.3      # OPEN 姿勢を保持する時間
    feed_duration_sec: 0.6      # FEED 押し込みを保持する時間
    # [ms] 指令再送周期
    command_period_ms: 20
    # ROS 2 QoS queue depth
    qos_depth: 1

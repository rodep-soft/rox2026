vesc_upper_belt_driver:
  ros__parameters:
    can_pub_topic: "/socketcan_bridge/tx"
    can_sub_topic: "/socketcan_bridge/rx"
    target_rpm_topic: "/upperbelt/target/rpm"  # std_msgs/msg/Int16 [RPM]。
    current_rpm_topic: "/upperbelt/current/rpm"  # std_msgs/msg/Int16 [RPM]。
    controller_id: 51  # upperbelt VESCのCAN ID
    command_timeout_ms: 500
    feedback_timeout_ms: 500
    max_rpm: 5600
    rpm_slew_rate: 1000.0


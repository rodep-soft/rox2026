/vesc_driver:
  ros__parameters:
    can_tx_topic: "/socketcan_bridge/tx"
    can_rx_topic: "/socketcan_bridge/rx"
    target_topic: "/vesc/target"
    target_array_topic: "/vesc/target_array"
    state_topic: "/vesc/state"
    state_array_topic: "/vesc/state_array"
    update_period_ms: 25               # VESCへのCAN指令周期
    state_array_publish_period_ms: 100 # state_arrayの配信周期
    # モータごとのstateは受信後即時配信

    motors:
      - upper_belt
      - under_belt
      - dribble

    upper_belt:
      logical_id: 10                  # 倫理ID(ROS2上での認識ID)
      controller_id: 51               # モータID(10進数)
      feedback_timeout_ms: 500        # フィードバックが返ってきているかのタイムアウト用
      max_rpm: 5600.0                 # 最大回転数(モータ固有)
      rpm_slew_rate: 1000.0          # 一秒間での加速量(回転数維持トルクレスポンス極限強化)
      startup_current_a: 8.5         # トルク・押出し底力電流値(8.0A)(10.0Aを超えると下側の赤ブラシが不安定に)
      rpm_control_threshold_rpm: 2000.0 # 回転数制御を開始する閾値(この回転数以上で回転数制御を開始する)

    under_belt:
      logical_id: 11
      controller_id: 52
      feedback_timeout_ms: 500
      max_rpm: 5600.0
      rpm_slew_rate: 1000.0
      startup_current_a: 10.5
      rpm_control_threshold_rpm: 2000.0

    dribble:
      logical_id: 12
      controller_id: 50
      feedback_timeout_ms: 500
      max_rpm: 5600.0
      rpm_slew_rate: 5000.0
      startup_current_a: 4.0
      rpm_control_threshold_rpm: 100.0

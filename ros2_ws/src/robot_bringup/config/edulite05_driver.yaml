edulite05_driver:
  ros__parameters:
    can_tx_topic: "/socketcan_bridge/tx"
    can_rx_topic: "/socketcan_bridge/rx"
    target_topic: "/edulite/target"
    target_array_topic: "/edulite/target_array"
    state_topic: "/edulite/state"
    state_array_topic: "/edulite/state_array"
    set_position_service: "/edulite/set_position"

    motors:
      - front_left
      - front_right
      - rear_left
      - rear_right
      - spring
      - dribble

    front_left:
      logical_id: 0
      can_id: 32
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      command_period_ms: 10

    front_right:
      logical_id: 1
      can_id: 33
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      command_period_ms: 10

    rear_left:
      logical_id: 2
      can_id: 34
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      command_period_ms: 10

    rear_right:
      logical_id: 3
      can_id: 35
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      command_period_ms: 10

    spring:
      logical_id: 4
      can_id: 40
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      command_period_ms: 50

    dribble:
      logical_id: 5
      can_id: 56
      control_mode: pp

      # この値は実機で測定して決める
      position_reference_mode: yaml_absolute
      startup_absolute_position_rad: 0.0
      minimum_position_rad: -1.57
      maximum_position_rad: 1.57

      command_period_ms: 50
      current_limit: 11.0
      speed_limit: 5.0
      acceleration: 150.0

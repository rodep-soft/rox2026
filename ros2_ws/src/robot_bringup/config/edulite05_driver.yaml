edulite05_driver:
  ros__parameters:
    can_tx_topic: "/socketcan_bridge/tx"
    can_rx_topic: "/socketcan_bridge/rx"
    target_topic: "/edulite/target"
    target_array_topic: "/edulite/target_array"
    state_topic: "/edulite/state"
    state_array_topic: "/edulite/state_array"
    set_position_service: "/edulite/set_position"

    motors:
      - front_left
      - front_right
      - rear_left
      - rear_right
      - spring
      - dribble

    front_left:
      logical_id: 0
      can_id: 32
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      current_feedback_enabled: false
      command_period_ms: 10

    front_right:
      logical_id: 1
      can_id: 33
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      current_feedback_enabled: false
      command_period_ms: 10

    rear_left:
      logical_id: 2
      can_id: 34
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      current_feedback_enabled: false
      command_period_ms: 10

    rear_right:
      logical_id: 3
      can_id: 35
      control_mode: velocity
      current_limit: 11.0
      acceleration: 150.0
      speed_limit: 50.0
      current_feedback_enabled: false
      command_period_ms: 10

    spring:
      logical_id: 4
      can_id: 40
      control_mode: pp

      position_reference_mode: service
      # stateは未原点のまま、上位ノードのホーミング指令だけ許可する。
      allow_unreferenced_position_commands: true
      minimum_position_rad: -1000000.0
      maximum_position_rad: 0.0

      current_limit: 11.0
      acceleration: 150.0
      # EduLite 05 rejects 40 rad/s in PP mode (0x7024 readback fails).
      speed_limit: 35.0
      current_feedback_enabled: false
      command_period_ms: 10
      # CAN feedbackが途絶えたら電源断・再接続として初期化と原点を破棄する。
      feedback_timeout_ms: 500

    dribble:
      logical_id: 5
      can_id: 56
      # 上位ノードが10 ms周期で滑らかな軌道を生成するため、
      # 内部プロファイルを毎回再計画するPPではなくCSPを使用する。
      control_mode: csp

      # この値は実機で測定して決める
      position_reference_mode: yaml_offset
      position_offset_rad: -0.01936626434326172
      minimum_position_rad: -1.57
      maximum_position_rad: 1.57

      command_period_ms: 10
      current_feedback_enabled: false
      current_feedback_period_ms: 100
      current_limit: 11.0
      speed_limit: 3.0
      acceleration: 150.0

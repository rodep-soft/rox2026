/game2_aim_node:
  ros__parameters:
    base_frame: "base_link"
    cmd_vel_topic: "/drive/cmd_vel"
    detections_topic: "/detections"
    camera_info_topic: "/camera/camera_info"
    target_distance: 4.0

    # ── 📐 カメラ物理・光学パラメータ ──
    camera_offset_x: 0.265  # [m] 前方オフセット (実測値: 265mm)
    camera_offset_y: 0.035  # [m] 左カメラオフセット (実測値: 35mm: 射出口より35mm左)
    camera_offset_z: 0.193  # [m] 上方オフセット (実測値: 193mm)
    camera_image_width: 1920.0
    camera_image_height: 1080.0
    camera_fx: 800.0        # [px] 水平焦点距離
    camera_fy: 800.0        # [px] 垂直焦点距離
    camera_cx: 960.0        # [px] 光学主点X
    camera_cy: 540.0        # [px] 光学主点Y

    # ── 🎯 旋回制御パラメータ (PD + Slew Rate + Damping) ──
    kp_yaw: 1.8             # 比例ゲイン (視覚誤差)
    yaw_command_sign: -1.0  # 機体のangular.z符号に合わせる（実機ログで確認済み）
    kd_yaw: 0.18            # 微分/制動ゲイン (IMU gyro_z角速度ダンピング)
    min_angular_z: 0.08     # [rad/s] 静止摩擦補償最小角速度 (オーバーシュート抑制)
    max_angular_z: 0.40     # [rad/s] 最大旋回角速度 (カメラブレ防止: 約23 deg/s)
    max_angular_accel: 2.5  # [rad/s^2] 旋回加減速度リミッター (スリップ・ブレ防止)
    yaw_tolerance: 0.008    # [rad] 角度誤差許容値 (約0.46度に極小化・超高精度ピタ止め)
    dist_tolerance: 0.05    # [m] 距離誤差許容値
    aim_yaw_offset_deg: 0.0 # [deg] 射出方向の左右照準オフセット (0.0: 真の計算幾何角度で狙う)

    # ── 🧪 テストモード切替 ──
    # true: ドリブル・ベルトを動かさず、車体の角度合わせ（旋回）だけをテスト
    # false: BeltMode連動を含むエイムアシスト (下段: LEVEL_1, 中段: LEVEL_2, 上段: LEVEL_3)
    test_alignment_only: false
    test_panel_state_display: true # true: 0.5秒ごとにターミナルへ9マス色付き起立/倒れ診断グリッドを出力

    tag_lost_timeout: 1.5   # [s] AprilTag見失い判定タイムアウト (旋回中のブレ耐性)
    search_angular_z: 0.0   # [rad/s] タグ未検出時の探索旋回速度 (0.0で静止待機, 推奨: 0.15)
    enable_double_panel_midpoint_targeting: true # 2枚立っている時は中点を狙う (左-中中点を最優先)
    midpoint_blend_ratio: 0.50      # 端列へのシフト比率 (0.50: 幾何学的真の中点)
    min_standing_aspect_ratio: 0.70 # 倒れ判定最小アスペクト比
    max_standing_tilt_deg: 30.0     # [deg] 倒れ判定最大法線傾き角 (30度以上傾いたら倒れと判定)
    max_standing_height_drop: 0.07  # [m] 倒れ判定最大落下量 (初期起立高さから7cm以上落下で倒れと判定)
    post_shot_delay_sec: 2.0        # [s] 射出完了から次探索までの着弾・打倒待ち時間 (2秒で確実に倒れを確認)
    shot_target_cooldown_sec: 2.0   # [s] 直前に撃った的の再照準禁止クールダウン
    shot_fallback_timeout: 5.0 # [s] ばね退避・ベルト待機・FEED完了を待つ保険タイムアウト
    min_detection_frames: 2 # ターゲットロックに必要な連続検出フレーム数 (ノイズ誤検出防止)
    visual_valid_timeout: 0.3 # [s] 照準完了判定に必要な直近視覚有効時間
    align_lost_timeout: 1.0 # [s] 照準旋回中にタグを完全に見失った場合の再探索タイムアウト

    # ── 🏷️ シュートパネル AprilTag ID ──
    # Row 0: 下段, Row 1: 中段, Row 2: 上段 (左から右の順)
    bottom_tags: [20, 21, 22]
    middle_tags: [17, 18, 19]
    top_tags: [14, 15, 16]


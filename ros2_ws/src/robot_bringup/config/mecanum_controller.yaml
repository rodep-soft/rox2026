mecanum_controller_node:
  ros__parameters:
    # subscribeする操作指令topic。geometry_msgs/msg/Twist。
    cmd_vel_topic: /mecanum/cmd_vel
    # std_msgs/msg/UInt8。0=STOP、1=DRIVE、2=SHOT_CYCLE、3=BELT_ONLY。
    operation_mode_topic: /operation_mode
    # std_msgs/msg/Bool。trueで全輪を0 rad/sにする。
    emergency_stop_topic: /emergency_stop
    # 各ホイールへpublishする角速度command topic。std_msgs/msg/Float32、単位はrad/s。
    front_left_velocity_topic: /mecanum/fl/vel_command
    front_right_velocity_topic: /mecanum/fr/vel_command
    rear_left_velocity_topic: /mecanum/rl/vel_command
    rear_right_velocity_topic: /mecanum/rr/vel_command
    # ROS 2 QoSのqueue depth。
    qos_depth: 3

    # [m] 大きくすると同じ車体速度に必要な車輪角速度が小さくなる。
    wheel_radius: 0.05
    robot_length: 0.47
    robot_width: 0.41

    # 各ホイール速度に掛ける補正係数。配列順序は出力速度と同一。
    velocity_corrections: [1.0, 1.0, 1.0, 1.0]
    # 前後速度の符号
    vx_sign: 1.0
    # 左右速度の符号
    vy_sign: 1.0
    # 旋回速度の符号
    angular_z_sign: 1.0
    # 4輪の最大角速度絶対値。超過時は全輪を同じ比率で縮小する[rad/s]。
    max_wheel_velocity_rad_s: 50.0

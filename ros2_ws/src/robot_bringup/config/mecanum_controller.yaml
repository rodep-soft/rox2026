/mecanum_controller_node:
  ros__parameters:
    cmd_vel_topic: "/mecanum/cmd_vel_heading"
    emergency_stop_topic: "/system/emergency_stop"
    target_array_topic: "/edulite/target_array"
    
    # 車輪の倫理IDの配列 [FRONT_L，FRONT_R，REAR_L，REAR_R]
    wheel_logical_ids: [0, 1, 2, 3]
    
    # ROS 2 QoSのqueue depth。
    qos_depth: 3
    # 非常停止中に全輪ゼロ指令を再送する周期[ms]
    emergency_stop_period_ms: 20

    # 直径150 mmの車輪半径[m]
    # ロボットの車輪間隔[m]
    wheel_radius: 0.075
    robot_length: 0.355
    robot_width: 0.353

    # 4輪の最大角速度絶対値[rad/s]
    max_wheel_velocity_rad_s: 50.0

ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. 車輪オドメトリ (/wheel/odometry)
    # 構造: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /wheel/odometry
    odom0_config: [true,  true,  false,    # x, y 位置
                   false, false, false,    # roll, pitch, yaw 姿勢
                   true,  true,  false,    # vx, vy 並進速度
                   false, false, true,     # vyaw 旋回角速度
                   false, false, false]    # 加速度
    odom0_differential: false
    odom0_queue_size: 10

    # 2. IMU センサ (/imu/data) - BNO055 9軸フュージョン
    # 構造: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    imu0: /imu/data
    imu0_config: [false, false, false,    # 位置 (IMU単体からは取らない)
                  false, false, true,     # 姿勢 (yaw角のみ融合)
                  false, false, false,    # 線速度 (IMU単体からは取らない)
                  true,  true,  true,     # 3軸角速度 (vroll, vpitch, vyaw を融合)
                  true,  true,  false]    # 2軸線加速度 (ax, ay を融合)
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # 3. AprilTag ビジョン絶対位置補正 (/apriltag/pose)
    # カメラでタグ認識した際、累積誤差(ドリフト)を絶対座標(x, y, yaw)で補正
    # 構造: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    pose0: /apriltag/pose
    pose0_config: [true,  true,  false,    # x, y 絶対位置
                   false, false, true,     # yaw 絶対姿勢
                   false, false, false,    # 速度
                   false, false, false,    # 角速度
                   false, false, false]    # 加速度
    pose0_differential: false
    pose0_queue_size: 5

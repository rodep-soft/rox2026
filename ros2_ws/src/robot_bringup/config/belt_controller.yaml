belt_controller_node:
  ros__parameters:
    belt_mode_topic: /belt/mode
    # hardware_driver(vesc_driver)へ送る目標回転数command topic。std_msgs/msg/Float32、単位はRPM。
    # under/upperの2モータへ同一RPMを送るため2本publishする。
    underbelt_rpm_topic: /underbelt/target/rpm
    upperbelt_rpm_topic: /upperbelt/target/rpm
    underbelt_current_rpm_topic: /underbelt/current/rpm  # VESC ID 51から受信する下ベルト実回転数。std_msgs/msg/Float32 [RPM]。
    upperbelt_current_rpm_topic: /upperbelt/current/rpm  # VESC ID 52から受信する上ベルト実回転数。std_msgs/msg/Float32 [RPM]。
    belt_ready_topic: /belt/ready  # std_msgs/msg/Bool。両ベルトが目標RPM付近で一定時間継続するとtrue。
    qos_depth: 1

    # belt_modeがSTOP(1)のときの目標回転数[RPM]。安全のため0固定。
    stop_rpm: 0.0
    # belt_modeがLEVEL_1(1)〜LEVEL_3(3)のときの目標回転数[RPM]。
    level_1_rpm: 1000.0
    level_2_rpm: 2000.0
    level_3_rpm: 3000.0
    # RPM指令をpublishする周期[ms]。
    command_period_ms: 10
    ready_tolerance_rpm: 100.0  # [RPM] 目標RPMへの到達とみなす許容誤差。
    ready_hold_sec: 0.1  # [s] 到達状態を連続して維持する必要時間。

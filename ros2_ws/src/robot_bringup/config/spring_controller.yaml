spring_controller_node:
  ros__parameters:
    # STM32から受けたリミットスイッチbyte内で使用するbit位置（0〜7）。
    limit_switch_bit_offset: 0
    # ROS 2 QoSのqueue depth。
    qos_depth: 3

    # [rad/s] 装填時に出す速度。正負の向きは機構に合わせる（プラスで引き込み）。
    loading_velocity_rad_s: 10.0
    # [rad/s] 発射時に出す速度。正負の向きは機構に合わせる（マイナスで発射）。
    fire_velocity_rad_s: -20.0

    # [s] 発射速度を維持する時間。
    fire_duration_sec: 0.3
    # [s] 装填異常としてERROR停止するまでの上限時間。
    load_timeout_sec: 18.0

    # [ms] 速度指令を再送する周期。
    command_period_ms: 10

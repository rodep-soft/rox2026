spring_controller_node:
  ros__parameters:
    # STM32から受けたリミットスイッチbyte内で使用するbit位置（0〜7）。
    limit_switch_bit_offset: 0
    # ROS 2 QoSのqueue depth。
    qos_depth: 3

    # [rad/request] 発射要求1回で累積目標へ加算する角度 9周分
    fire_increment_rad: 56.54866776
    # [rad/s] 未原点時に目標位置を負方向へずらす速度。
    homing_velocity_rad_s: 5.0
    # [s] リミットスイッチが見つからない場合のタイムアウト。
    homing_timeout_sec: 30.0

    # [ms] 位置指令更新周期。
    command_period_ms: 50

    logical_id: 4
    target_topic: "/edulite/target"
    state_topic: "/edulite/state"
    set_position_service: "/edulite/set_position"

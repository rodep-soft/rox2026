spring_controller_node:
  ros__parameters:
    # 変更すると装填完了に使うリミットスイッチのdata indexが変わる。
    limit_switch_index: 1
    # ROS 2 QoSのqueue depth。
    qos_depth: 3

    # [rad/s] 装填時に出す速度。正負の向きは機構に合わせる。
    loading_velocity_rad_s: -5.0
    # [rad/s] 発射時に出す速度。正負の向きは機構に合わせる。
    fire_velocity_rad_s: -40.0

    # [s] 発射速度を維持する時間。
    fire_duration_sec: 0.5
    # [s] 装填異常としてERROR停止するまでの上限時間。
    load_timeout_sec: 5.0

    # [ms] 速度指令を再送する周期。
    command_period_ms: 10

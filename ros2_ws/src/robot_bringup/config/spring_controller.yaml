/spring_controller_node:
  ros__parameters:
  
    # STM32から受けたリミットスイッチbyte内で使用するbit位置（0〜7）
    limit_switch_bit_offset: 0
    # ROS 2 QoSのqueue depth。
    qos_depth: 3

    # [rad] 0点合わせ後に待機位置へ移動するためのオフセット角度（逆回転・正方向）
    standby_offset_rad: 3.5   # 3.5

    # [rad] 待機位置・目標位置到達判定の許容誤差
    position_tolerance_rad: 0.05

    # [rad/request] 発射要求1回で累積目標へ加算する角度
    fire_increment_rad: -43.9822971
    
    # ── ゆっくり射出 ──
    slow_fire_target_position_rad: 11.5
    slow_fire_base_velocity_rad_s: 20.0
    slow_fire_velocity_gain_rad_per_m: 2.0
    slow_fire_min_velocity_rad_s: 5.0
    slow_fire_max_velocity_rad_s: 20.0
    odometry_timeout_sec: 0.2
    slow_fire_return_velocity_rad_s: 28.0
    slow_fire_settle_timeout_sec: 1.5       # [s] 目標送信完了後に実機の到達を待つ猶予
    
    # [rad/s] 未原点時に目標位置を負方向へずらす速度
    homing_velocity_rad_s: 4.0
    
    # [s] リミットスイッチが見つからない場合のタイムアウト
    homing_timeout_sec: 50.0
    
    # [rad/s] この速度以下を停止とみなす
    stopped_velocity_threshold_rad_s: 0.05
    
    # 停止判定に必要な連続フィードバック数
    required_stable_feedback_count: 3

    # [ms] 位置指令更新周期
    command_period_ms: 50

    logical_id: 4
    target_topic: "/edulite/target"
    state_topic: "/edulite/state"
    set_position_service: "/edulite/set_position"

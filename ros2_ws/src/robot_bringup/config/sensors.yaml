mecanum_odometry_node:
  ros__parameters:
    wheel_radius: 0.05     #車輪直径
    robot_length: 0.47     #ロボットの長さ
    robot_width: 0.41      #ロボットの幅
    publish_rate: 50.0     #公開レート
    feedback_timeout: 0.25 #各ホイールの速度フィードバックを受信しない場合のタイムアウト時間[s]
    wheel_feedback_topics: [/mecanum/fl/feedback, /mecanum/fr/feedback, /mecanum/rl/feedback, /mecanum/rr/feedback]


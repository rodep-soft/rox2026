/heading_hold_node:
  ros__parameters:
    # IMU ジャイロ補正のPID
    kp: 4.0
    ki: 0.0
    kd: 0.05
    integral_limit: 0.5

    heading_deadband_rad: 0.02
    rotation_input_deadband_rad_s: 0.02
    max_correction_rad_s: 1.5

    control_period_ms: 10   # トピック配信周期
    command_timeout_ms: 500 # cmd_velのタイムアウト判断時間
    imu_timeout_ms: 250     # IMUのタイムアウト判断時間
    command_qos_depth: 10

    raw_cmd_vel_topic: /mecanum/cmd_vel
    imu_topic: /imu/data
    corrected_cmd_vel_topic: /mecanum/cmd_vel_heading

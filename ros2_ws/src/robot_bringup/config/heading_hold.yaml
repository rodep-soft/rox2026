# ==============================================================================
# BNO055 Heading Control Parameters Configuration
# ==============================================================================

bno055_heading_control_node:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. Topic Configuration & Pipeline
    # --------------------------------------------------------------------------
    imu_topic: "/imu/data"                         # Input IMU topic
    cmd_vel_in_topic: "/drive/cmd_vel"             # Raw input cmd_vel
    cmd_vel_out_topic: "/mecanum/cmd_vel_heading"  # Corrected output cmd_vel

    # --------------------------------------------------------------------------
    # 2. Feedforward (FF) Control & Cross-Coupling Drift Cancellation
    # --------------------------------------------------------------------------
    enable_feedforward: true           # Enable feedforward
    k_ff_vel: 1.0                      # Angular velocity command FF gain (w_cmd)
    k_ff_acc: 0.0                      # Angular acceleration FF gain (dw_cmd/dt)
    k_ff_drift_vx: 0.0                 # Translational Vx drift compensation gain
    k_ff_drift_vy: 0.0                 # Translational Vy drift compensation gain
    k_ff_drift_ax: 0.0                 # Translational Ax acceleration drift compensation gain
    k_ff_drift_ay: 0.0                 # Translational Ay acceleration drift compensation gain
    accel_filter_alpha: 0.3            # Low-pass filter alpha for acceleration estimation (0.0 - 1.0)

    # --------------------------------------------------------------------------
    # 3. Control Gains (PID)
    # --------------------------------------------------------------------------
    kp: 1.6                            # Proportional Gain (smoothed to prevent fluttering)
    ki: 0.0                            # Integral Gain
    kd: 0.12                           # Derivative Gain (proper damping for inertia)
    kff: 1.0                           # Feedforward Gain (alias for k_ff_vel)
    max_i_term: 0.5                    # Anti-windup integral saturation limit
    max_output: 1.5                    # Maximum angular velocity correction limit (rad/s)
    deadband_deg: 0.8                  # Deadband in degrees
    angular_deadband: 0.05             # Turning threshold (rad/s) to start 2-DOF target tracking
    turn_relock_delay: 0.10            # Delay (seconds) after manual turn to prevent snap-back

    # --------------------------------------------------------------------------
    # 4. Safety Watchdog & Diagnostics
    # --------------------------------------------------------------------------
    cmd_vel_timeout: 0.5               # Command loss timeout (s)
    imu_timeout: 0.25                  # IMU loss timeout (s)
    enable_diagnostics: true           # Publish 1Hz real-time diagnostic status (/diagnostics)

/heading_hold_node:
  ros__parameters:
    # IMU ジャイロ補正のPID
    kp: 5.5
    ki: 0.0
    kd: 0.12
    integral_limit: 0.5

    heading_deadband_rad: 0.01
    rotation_input_deadband_rad_s: 0.01
    max_correction_rad_s: 15.0
    # 並進速度に応じてP/D補正を滑らかに強める
    speed_boost_start_m_s: 2.6
    speed_boost_full_m_s: 4.0
    speed_boost_multiplier: 5.0

    # 急加減速・方向反転時は速度が低くてもP/D補正を強める
    acceleration_boost_start_m_s2: 4.5
    acceleration_boost_full_m_s2: 6.5
    acceleration_boost_multiplier: 1.0
    acceleration_filter_time_constant_sec: 0.05

    # 符号付き指令加速度から、角度がずれる前にyaw補正を加える
    acceleration_feedforward_x_positive_gain: 0.0 #0.1
    acceleration_feedforward_x_negative_gain: -0.0 #-0.4 
    acceleration_feedforward_y_positive_gain: -0.0 #-0.97
    acceleration_feedforward_y_negative_gain: 0.0 #0.92
    max_acceleration_feedforward_rad_s: 0.01 #0.3

    # メカナム車輪上限内で旋回補正を先に確保し、残りを並進に割り当てる
    wheel_radius: 0.075
    robot_length: 0.355
    robot_width: 0.353
    max_wheel_velocity_rad_s: 50.0

    rotation_settle_velocity_rad_s: 0.08
    rotation_settle_duration_ms: 200

    control_period_ms: 10   # トピック配信周期
    command_timeout_ms: 500 # cmd_velのタイムアウト判断時間
    imu_timeout_ms: 200     # IMUのタイムアウト判断時間
    raw_cmd_vel_topic: /drive/cmd_vel
    imu_topic: /imu/data
    corrected_cmd_vel_topic: /mecanum/cmd_vel_heading
    heading_enable_topic: /heading_control/enable

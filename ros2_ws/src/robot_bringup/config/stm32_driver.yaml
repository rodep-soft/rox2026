stm32_driver_node:
  ros__parameters:
    motor_target_rpm_topics:
      - /stm32/underbelt/target/rpm
      - /stm32/upperbelt/target/rpm
      - /stm32/dribble/target/rpm
    motor_current_rpm_topics:
      - /stm32/underbelt/current/rpm
      - /stm32/upperbelt/current/rpm
      - /stm32/dribble/current/rpm
    led_cmd_topic: "/led/cmd"  # std_msgs/msg/UInt8
    limit_sw_topic: "/limit_switches"  # std_msgs/msg/UInt8MultiArray、bitごとに1スイッチ
    timeout_ms: 500  # heartbeatのタイムアウト検知時間
    keep_alive_period_ms: 100  # heartbeatの送信・判定周期

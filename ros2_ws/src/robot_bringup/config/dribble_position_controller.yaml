dribble_position_controller:
  ros__parameters:
    # [rad] それぞれのdribble positinの位置
    dribble_position_rad: 0.35
    intake_position_rad: -1.0
    shoot_position_rad: 1.3
    open_position_rad: -1.3

    # [rad] 目標との誤差との許容値
    position_tolerance_rad: 0.02
    # [s] 長くするとSHOOT位置で保持する時間が延びる。
    shoot_to_dribble_delay_sec: 0.6
    # [s] 短くすると位置移動異常から早くDRIBBLE復帰へ移る。
    move_timeout_sec: 3.0
    # [s] 短くするとfeedback断を早く検出するが、遅延に敏感になる。
    feedback_timeout_sec: 0.5
    # [ms] 移動中の目標位置送信とfeedback確認の周期。
    command_period_ms: 20
    # ROS 2 QoSのqueue depth。
    qos_depth: 1

dribble_position_controller:
  ros__parameters:
    dribble_position_command_topic: /dribble/position_command  # std_msgs/msg/Float32 [rad]。移動中はcommand_period_ms周期でpublishする。
    dribble_position_feedback_topic: /dribble/position_feedback  # std_msgs/msg/Float32 [rad]。hardware_driverから受信する実位置。
    dribble_position_mode_topic: /dribble/position_mode  # std_msgs/msg/UInt8。0=DRIBBLE、1=SHOOT、2=MAX_OPEN。移動中の指令は無視する。
    intake_shoot_request_topic: /dribble/intake_shoot_request  # std_msgs/msg/Bool。trueでINTAKE→SHOOT→DRIBBLEを開始する。
    emergency_stop_topic: /emergency_stop  # std_msgs/msg/Bool。trueで移動中でもDRIBBLE位置を指令する。
    dribble_position_rad: 0.2  # [rad] DRIBBLE位置。
    intake_position_rad: -1.0  # [rad] SHOOT動作で最初に移動するINTAKE位置。
    shoot_position_rad: 1.3  # [rad] INTAKE到達後に移動するSHOOT位置。
    max_open_position_rad: -1.3  # [rad] L2+Optionsで移動する最大開放位置。
    position_tolerance_rad: 0.02  # [rad] 到達とみなす許容誤差。
    shoot_to_dribble_delay_sec: 1.0  # [s] SHOOT到達後、DRIBBLEへ戻るまでの保持時間。
    move_timeout_sec: 3.0  # [s] 位置移動のtimeout。超過時はDRIBBLE位置を指令する。
    feedback_timeout_sec: 0.5  # [s] feedbackのtimeout。超過時はDRIBBLE位置を指令する。
    command_period_ms: 20  # [ms] 移動中の目標位置送信とfeedback確認の周期。
    qos_depth: 1  # ROS 2 QoSのqueue depth。

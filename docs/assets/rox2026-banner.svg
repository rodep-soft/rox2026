  <text x="600" y="238" text-anchor="middle" fill="#a9b9ca" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="3">ROS 2  /  CAN  /  AUTONOMOUS CONTROL</text>
  <text x="1090" y="288" text-anchor="end" fill="#6f8498" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2">RoDEP</text>

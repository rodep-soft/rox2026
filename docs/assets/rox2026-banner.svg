    <circle cx="665" cy="237" r="6"/><circle cx="737" cy="165" r="6"/>
    <circle cx="952" cy="165" r="6"/><circle cx="990" cy="203" r="6"/>
  </g>
  <text x="600" y="135" text-anchor="middle" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="10">ROX2026</text>
  <rect x="365" y="160" width="470" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

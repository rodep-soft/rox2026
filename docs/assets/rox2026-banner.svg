  <path d="M0 255H185l50-50h220l32 32h178l72-72h215l38 38h230" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".5"/>
  <g fill="none" stroke="#00d4ff" stroke-width="3" opacity=".8">
    <circle cx="106" cy="84" r="38"/>
    <circle cx="106" cy="84" r="16"/>
    <path d="M106 28v18M106 122v18M50 84h18M144 84h18M67 45l13 13M132 110l13 13M145 45l-13 13M80 110l-13 13"/>
  </g>
  <g fill="#00d4ff">

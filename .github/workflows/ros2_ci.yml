name: ros2 build
# This workflow builds ROS 2 packages using Docker Buildx with GHA Layer Caching.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      # ── ⚡ Docker Buildx & GHA キャッシュのセットアップ ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with GHA Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: rox2026-ros2_rox2026:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── ⚡ C++ Compilation Cache (ccache) の永続化（最速設定） ──
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('ros2_ws/src/**/CMakeLists.txt', 'ros2_ws/src/**/package.xml', 'ros2_ws/src/rox2026.repos') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('ros2_ws/src/**/CMakeLists.txt', 'ros2_ws/src/**/package.xml', 'ros2_ws/src/rox2026.repos') }}-
            ccache-${{ runner.os }}-

      # ── ⚡ Colcon Build 中間ディレクトリの永続化 ──
      - name: Cache colcon build directory
        uses: actions/cache@v4
        with:
          path: ros2_ws/build
          key: colcon-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            colcon-build-${{ runner.os }}-

      - name: Start container
        run: |
          mkdir -p ~/.ccache
          docker compose up -d

      # ── 🔄 VCS 外部リポジトリの同期 (libbno055-linux, zenoh_joy_rs) ──
      - name: Sync external VCS repositories
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec "
            cd /root/ros2_ws && \
            vcs import src < src/rox2026.repos || true"

      - name: Format C++
        if: github.event_name == 'pull_request'
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec "
            CFG=\$(find /opt/ros \
            -path "*/ament_uncrustify/configuration/ament_code_style.cfg" | head -n 1) && \
            find src \
            -path 'src/libbno055-linux' -prune \
            -o -path 'src/zenoh_joy_rs' -prune \
            -o \
            \( \
              -name '*.cpp' \
              -o -name '*.hpp' \
              -o -name '*.h' \
              -o -name '*.ipp' \
            \) \
            -exec uncrustify \
              -c \
              \$CFG \
              --replace \
              --no-backup \
              {} +"

      - name: Format Python
        if: github.event_name == 'pull_request'
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec "
            black src --exclude '/(libbno055-linux|zenoh_joy_rs)/'"

      - name: Format CMake
        if: github.event_name == 'pull_request'
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec "
            find src \
            -path 'src/libbno055-linux' -prune \
            -o -path 'src/zenoh_joy_rs' -prune \
            -o \
            -name 'CMakeLists.txt' \
            -exec cmake-format --config-files .cmake-format.yml \
            --in-place {} +"

      # ── ⚡ ccache 最適化設定 ＆ 爆速 colcon build ──
      - name: Run build (Accelerated with ccache & ninja)
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec " 
            export CCACHE_DIR='/root/.ccache' && \
            export CCACHE_MAXSIZE='5G' && \
            export CCACHE_COMPRESS='true' && \
            export CCACHE_COMPRESSLEVEL='1' && \
            export CCACHE_SLOPPINESS='time_macros,include_file_mtime,file_macro' && \
            export CCACHE_BASEDIR='/root/ros2_ws' && \
            export CCACHE_NOHASHDIR='true' && \
            export CC='/usr/lib/ccache/gcc' && \
            export CXX='/usr/lib/ccache/g++' && \
            source /opt/ros/humble/setup.bash && \
            cd /root/ros2_ws && \
            colcon build \
              --merge-install \
              --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
              --parallel-workers \$(nproc) && \
            echo '── 📊 ccache 統計情報 ──' && \
            ccache -s"

      # ── 📦 ARM64/RDK 用ビルド済みバイナリのアーカイブ作成 ──
      - name: Package install directory
        run: |
          tar -czf rox2026-install.tar.gz -C ros2_ws install

      - name: Upload pre-built binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rox2026-install
          path: rox2026-install.tar.gz
          retention-days: 14

      - name: Commit formatted code
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet
          then
            git commit -m 'style: auto format'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Stop container
        if: always()
        run: |
          docker compose down

name: ros2 build
# This workflow builds ROS 2 packages using Docker Compose.
# It is triggered on push and pull request events. The workflow ensures that only one instance runs for a given branch or pull request, canceling any in-progress runs if a new one is triggered.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      # ── ⚡ Docker レイヤーキャッシュ (Start container の爆速化) ──
      - name: Cache Docker layers
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      # ── ⚡ C++ Build Cache (ccache) の永続化 ──
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Start container
        run: |
          docker compose up -d

      - name: Install CI tools & Setup ccache
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec "
            apt-get update -qq && \
            apt-get install -y --no-install-recommends ccache uncrustify ros-humble-ament-uncrustify python3-pip && \
            pip3 install --quiet black cmake-format"

      - name: Format C++
        if: github.event_name == 'pull_request'
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec "
            CFG=\$(find /opt/ros \
            -path "*/ament_uncrustify/configuration/ament_code_style.cfg" | head -n 1) && \
            find src \
            \( \
              -name '*.cpp' \
              -o -name '*.hpp' \
              -o -name '*.h' \
              -o -name '*.ipp' \
            \) \
            -exec uncrustify \
              -c \
              \$CFG \
              --replace \
              --no-backup \
              {} +"

      - name: Format Python
        if: github.event_name == 'pull_request'
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec "
            black src"

      - name: Format CMake
        if: github.event_name == 'pull_request'
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec "
            find src -name 'CMakeLists.txt' \
            -exec cmake-format --config-files .cmake-format.yml \
            --in-place {} +"

      # ── ⚡ ccache を活用した爆速 colcon build ──
      - name: Run build (Accelerated with ccache)
        run: |
          docker compose exec -T ros2_rox2026 \
          bash -ec " 
            export CC='/usr/lib/ccache/gcc' && \
            export CXX='/usr/lib/ccache/g++' && \
            source /opt/ros/humble/setup.bash && \
            cd /root/ros2_ws && \
            colcon build --symlink-install --parallel-workers \$(nproc)"

      - name: Commit formatted code
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet
          then
            git commit -m 'style: auto format'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Stop container
        if: always()
        run: |
          docker compose down